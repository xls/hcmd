# Holos Commander - the ayu-light theme.
# Location: ~/.config/holoscommander/themes/ayu-light.toml
#
# Generated from a semantic palette so every slot is covered and no two themes
# disagree about what a slot means. Colours are RGB; the renderer quantizes to
# 256 or 16 as the terminal allows.

name = "ayu-light"

[panel]
bg              = "#fafafa"
fg              = "#5c6773"
dir_fg          = "#000000"
exec_fg         = "#86b300"
link_fg         = "#4cbf99"
archive_fg      = "#a37acc"
marked_fg       = "#a85400"
cursor_bg       = "#ff9940"
cursor_fg       = "#fafafa"
# Drawn when the command line has focus: still clearly visible, one step back.
cursor_bg_unfocused = "#e7e8e9"
cursor_fg_unfocused = "#5c6773"
# The cursor bar on the panel that is not active at all.
inactive_cursor_bg  = "#f0f1f2"
inactive_cursor_fg  = "#8a9199"
border          = "#ff9940"
inactive_border = "#8a9199"
header_bg       = "#fafafa"
header_fg       = "#f2ae49"
status_bg       = "#fafafa"
status_fg       = "#4cbf99"

[cmdline]
bg        = "#fcfcfc"
fg        = "#5c6773"
prompt_fg = "#86b300"
caret     = "#000000"
# The caret is always drawn, focused or not.
caret_unfocused = "#8a9199"

[keybar]
number_fg = "#5c6773"
label_bg  = "#ff9940"
label_fg  = "#fafafa"

[dialog]
bg           = "#e7e8e9"
fg           = "#5c6773"
title        = "#ff9940"
border       = "#8a9199"
button       = "#ff9940"
button_focus = "#f07171"
input_bg     = "#fcfcfc"
input_fg     = "#000000"

[viewer]
bg            = "#fafafa"
fg            = "#5c6773"
line_numbers  = "#8a9199"
match         = "#f2ae49"
current_match = "#f07171"
hex_offset    = "#4cbf99"
hex_ascii     = "#86b300"
selection_bg  = "#a37acc"
selection_fg  = "#fafafa"

[syn]
keyword     = "#a37acc"
string      = "#86b300"
comment     = "#8a9199"
type        = "#4cbf99"
function    = "#399ee6"
number      = "#f1905d"
constant    = "#f1905d"
operator    = "#5c6773"
punctuation = "#8a9199"
variable    = "#5c6773"

# Mapping used when the terminal has only 16 colors.
[fallback_16]
"#fafafa" = "white"
"#fcfcfc" = "white"
"#5c6773" = "black"
"#000000" = "bright_white"
"#ff9940" = "bright_cyan"
"#e7e8e9" = "bright_white"
"#f0f1f2" = "bright_white"
"#8a9199" = "bright_black"
"#f07171" = "bright_red"
"#86b300" = "bright_green"
"#f2ae49" = "bright_yellow"
"#399ee6" = "bright_blue"
"#a37acc" = "bright_magenta"
"#4cbf99" = "bright_cyan"
"#f1905d" = "bright_red"
