name: npm installer

# Its own workflow, because it has nothing to do with the binaries.
#
# The package downloads a release build at INSTALL time; it does not contain
# one and does not need one to exist in order to be built, checked or
# published. Living inside the release workflow meant a change to one Node
# file could not be tested without first cross-compiling six targets, and a
# typo in it kept six working binaries off the release page. Here it runs in
# seconds and answers for itself.

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/npm/**"
      - ".github/workflows/npm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: build, check and publish
    runs-on: ubuntu-latest
    # At job level rather than on the publish step. A step's `if` cannot read
    # the `secrets` context at all, and a step's own `env` block is not
    # dependably in scope for that same step's `if` - so the guard below could
    # decide "no token" while the token was sitting right there, and skip the
    # publish silently. Job level is unambiguous, and the step inherits it for
    # `npm publish` itself.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The package's version IS the version it installs, so it comes from
      # Cargo.toml rather than being maintained by hand in a second place.
      - name: Take the version from Cargo.toml
        id: v
        run: |
          set -eu
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          cd packaging/npm
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${version}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          cat package.json

      - name: Check it parses and declares what it should
        run: |
          set -eu
          cd packaging/npm
          node --check install.js
          # The bin entry is the whole interface: `npx hcmd-installer` is a
          # lookup of this name, and a package that packs without it installs
          # nothing.
          node -e "
            const pkg = require('./package.json');
            if (!pkg.bin || !pkg.bin['hcmd-installer']) {
              throw new Error('package.json declares no hcmd-installer bin');
            }
            if (pkg.version !== '${{ steps.v.outputs.version }}') {
              throw new Error('version was not substituted');
            }
          "

      # Runs the installer for real against whatever is published, into a
      # throwaway directory, and executes what it installed. Skipped before the
      # first release exists, and never silently: it says which.
      - name: Install from the published release
        run: |
          set -eu
          dir=$(mktemp -d)
          if HCMD_INSTALL_DIR="$dir" node packaging/npm/install.js; then
            "$dir/hcmd" --version
            echo "the installer works against the published release"
          else
            echo "no published release to install from yet; the package is still built and checked"
          fi

      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd packaging/npm && npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz

      # On a tag, or on a deliberate manual run, and only with a token.
      # Without one the job above still proves the package builds, so a broken
      # installer is caught either way.
      #
      # `workflow_dispatch` publishes too, because the first publish happens
      # *after* the token is added and the tag that wanted it has already been
      # pushed. Without this, adding `NPM_TOKEN` would do nothing until the
      # next release. The version comes from `Cargo.toml`, so a manual run
      # publishes whatever version the checked-out tree says it is.
      - name: Publish
        if: >-
          (startsWith(github.ref, 'refs/tags/v')
            || github.event_name == 'workflow_dispatch')
          && env.NODE_AUTH_TOKEN != ''
        run: |
          set -o pipefail
          cd packaging/npm
          if npm publish --access public 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi
          # npm answers 404 to a PUT it will not authorise, rather than 403,
          # so that it does not reveal whether a package exists. Read as-is it
          # says the package is missing, which is the opposite of the truth and
          # sends the reader looking in the wrong place entirely.
          if grep -q 'E404' /tmp/publish.log; then
            echo "::error::NPM_TOKEN cannot publish hcmd-installer."
            echo "::error::npm answers 404 to a PUT it will not authorise, so this"
            echo "::error::is a permissions answer and not a missing package."
            echo "::error::Replace the secret with a Classic Automation token, or a"
            echo "::error::granular token with read-and-write covering this package."
            echo "::error::Nothing is lost meanwhile: the installer fetches the"
            echo "::error::latest release, so the published package installs this"
            echo "::error::version already. A republish is only needed when"
            echo "::error::install.js itself changes."
          fi
          exit 1

      - name: Say why nothing was published
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "No NPM_TOKEN secret, so the package was built and checked but"
          echo "not published. Add one under Settings > Secrets and variables"
          echo "> Actions, named NPM_TOKEN."
