# The volume header of a firmware image. The signature _FVH is at 40, after
# the zero vector and the filesystem GUID.

name   = "UEFI firmware volume"
endian = "little"
magic  = { offset = 40, bytes = "5F465648" }

[[field]]
name   = "zero_vector"
type   = "bytes"
size   = 16
offset = 0

[[field]]
name   = "fs_guid"
type   = "bytes"
size   = 16
offset = 16

[[field]]
name   = "fv_length"
type   = "u64"
offset = 32

[[field]]
name   = "signature"
type   = "char"
size   = 4
offset = 40

[[field]]
name   = "attributes"
type   = "u32"
offset = 44

[[field]]
name   = "header_length"
type   = "u16"
offset = 48

[[field]]
name   = "checksum"
type   = "u16"
offset = 50

[[field]]
name   = "ext_header_offset"
type   = "u16"
offset = 52

[[field]]
name   = "reserved"
type   = "u8"
offset = 54

[[field]]
name   = "revision"
type   = "u8"
offset = 55
