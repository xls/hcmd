# The magic is the fixed header size of 76 followed by the shell link class
# id. The three times are Windows FILETIME, which counts 100-nanosecond
# intervals from 1601 and is not the Unix time the inspector offers.

name   = "Windows LNK"
endian = "little"
magic  = { offset = 0, bytes = "4C00000001141A0000000000C000000000000046" }

[[field]]
name   = "header_size"
type   = "u32"
offset = 0

[[field]]
name   = "link_clsid"
type   = "bytes"
size   = 16
offset = 4

[[field]]
name   = "link_flags"
type   = "u32"
offset = 20

[[field]]
name   = "file_attributes"
type   = "u32"
offset = 24

[[field]]
name   = "creation_time"
type   = "u64"
offset = 28

[[field]]
name   = "access_time"
type   = "u64"
offset = 36

[[field]]
name   = "write_time"
type   = "u64"
offset = 44

[[field]]
name   = "file_size"
type   = "u32"
offset = 52

[[field]]
name   = "icon_index"
type   = "i32"
offset = 56

[[field]]
name   = "show_command"
type   = "u32"
offset = 60

[[field]]
name   = "hotkey"
type   = "u16"
offset = 64

[[field]]
name   = "reserved1"
type   = "u16"
offset = 66

[[field]]
name   = "reserved2"
type   = "u32"
offset = 68

[[field]]
name   = "reserved3"
type   = "u32"
offset = 72

[summary]
title = "Windows shortcut"

[[summary.line]]
label  = "Target size"
field  = "file_size"
render = "size"

[[summary.line]]
label  = "Window"
field  = "show_command"
render = "enum"
enum   = { 1 = "normal", 3 = "maximised", 7 = "minimised" }

[[summary.line]]
label  = "Icon index"
field  = "icon_index"

[[summary.line]]
label  = "Contents"
field  = "link_flags"
render = "flags"
flags  = { 1 = "target id list", 2 = "link info", 4 = "name", 8 = "relative path", 16 = "working directory", 32 = "arguments", 64 = "icon location" }
