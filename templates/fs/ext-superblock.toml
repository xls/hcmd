[summary]
title = "ext2, ext3 or ext4 volume"

[[summary.line]]
label  = "Volume name"
field  = "s_volume_name"
render = "text"

[[summary.line]]
label  = "Last mounted on"
field  = "s_last_mounted"
render = "text"

[[summary.line]]
label  = "Block size"
field  = "s_log_block_size"
render = "enum"
enum   = { 0 = "1 KB", 1 = "2 KB", 2 = "4 KB", 3 = "8 KB", 4 = "16 KB", 5 = "32 KB", 6 = "64 KB" }

[[summary.line]]
label  = "Blocks"
field  = "s_blocks_count_lo"

[[summary.line]]
label  = "Free blocks"
field  = "s_free_blocks_count_lo"

[[summary.line]]
label  = "Inodes"
field  = "s_inodes_count"

[[summary.line]]
label  = "Inode size"
field  = "s_inode_size"
unit   = "bytes"

[[summary.line]]
label  = "State"
field  = "s_state"
render = "enum"
enum   = { 1 = "cleanly unmounted", 2 = "errors detected", 4 = "orphans being recovered" }

[[summary.line]]
label  = "On error"
field  = "s_errors"
render = "enum"
enum   = { 1 = "continue", 2 = "remount read-only", 3 = "panic" }

[[summary.line]]
label  = "Last written"
field  = "s_wtime"
render = "time"

[[summary.line]]
label  = "Last checked"
field  = "s_lastcheck"
render = "time"

[[summary.line]]
label  = "Mounts since check"
field  = "s_mnt_count"
