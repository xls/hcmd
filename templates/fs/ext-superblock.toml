# The superblock is at byte 1024 of the volume, not at its start, so the
# magic is at 1080. s_magic reads 61267 there. Which of ext2, ext3 and ext4
# this is comes from the feature bits at 92, not from anything named in the
# magic.

name   = "ext2/3/4 superblock"
endian = "little"
offset = 1024
magic  = { offset = 1080, bytes = "53EF" }

[[field]]
name   = "s_inodes_count"
type   = "u32"
offset = 0

[[field]]
name   = "s_blocks_count_lo"
type   = "u32"
offset = 4

