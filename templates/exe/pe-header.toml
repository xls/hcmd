# The PE signature, the COFF header and a PE32+ optional header. Apply it at
# the offset the DOS header's e_lfanew names; there is no magic here because
# that offset varies. optional_magic reads 523 for PE32+ and 267 for plain
# PE32, whose optional header from 24 on is laid out differently.

name   = "PE header (PE32+)"
endian = "little"

[[field]]
name   = "pe_signature"
type   = "char"
size   = 4
offset = 0

[[field]]
name   = "machine"
type   = "u16"
offset = 4

[[field]]
name   = "number_of_sections"
type   = "u16"
offset = 6

[[field]]
name   = "time_date_stamp"
type   = "u32"
offset = 8

[[field]]
name   = "pointer_to_symbol_table"
type   = "u32"
offset = 12

[[field]]
name   = "number_of_symbols"
type   = "u32"
offset = 16

[[field]]
name   = "size_of_optional_header"
type   = "u16"
offset = 20

[[field]]
name   = "characteristics"
type   = "u16"
offset = 22

[[field]]
name   = "optional_magic"
type   = "u16"
offset = 24

[[field]]
name   = "major_linker_version"
type   = "u8"
offset = 26

[[field]]
name   = "minor_linker_version"
type   = "u8"
offset = 27

[[field]]
name   = "size_of_code"
type   = "u32"
offset = 28

[[field]]
name   = "size_of_initialized_data"
type   = "u32"
offset = 32

[[field]]
name   = "size_of_uninitialized_data"
type   = "u32"
offset = 36

[[field]]
name   = "address_of_entry_point"
type   = "u32"
offset = 40

[[field]]
name   = "base_of_code"
type   = "u32"
offset = 44

[[field]]
name   = "image_base"
type   = "u64"
offset = 48

[[field]]
name   = "section_alignment"
type   = "u32"
offset = 56

[[field]]
name   = "file_alignment"
type   = "u32"
offset = 60

[[field]]
name   = "major_os_version"
type   = "u16"
offset = 64

[[field]]
name   = "minor_os_version"
type   = "u16"
offset = 66

[[field]]
name   = "major_image_version"
type   = "u16"
offset = 68

[[field]]
name   = "minor_image_version"
type   = "u16"
offset = 70

[[field]]
name   = "major_subsystem_version"
type   = "u16"
offset = 72

[[field]]
name   = "minor_subsystem_version"
type   = "u16"
offset = 74

[[field]]
name   = "win32_version_value"
type   = "u32"
offset = 76

[[field]]
name   = "size_of_image"
type   = "u32"
offset = 80

[[field]]
name   = "size_of_headers"
type   = "u32"
offset = 84

[[field]]
name   = "checksum"
type   = "u32"
offset = 88

[[field]]
name   = "subsystem"
type   = "u16"
offset = 92

[[field]]
name   = "dll_characteristics"
type   = "u16"
offset = 94

[[field]]
name   = "size_of_stack_reserve"
type   = "u64"
offset = 96

[[field]]
name   = "size_of_stack_commit"
type   = "u64"
offset = 104

[[field]]
name   = "size_of_heap_reserve"
type   = "u64"
offset = 112

[[field]]
