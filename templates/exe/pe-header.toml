[summary]
title = "Windows PE binary"

[[summary.line]]
label  = "Machine"
field  = "machine"
render = "enum"
enum   = { 332 = "x86", 448 = "ARM", 452 = "ARM Thumb-2", 512 = "IA-64", 20530 = "RISC-V 32", 20580 = "RISC-V 64", 34404 = "x86-64", 43620 = "ARM64" }

[[summary.line]]
label  = "Format"
field  = "optional_magic"
render = "enum"
enum   = { 263 = "ROM image", 267 = "PE32", 523 = "PE32+" }

[[summary.line]]
label  = "Subsystem"
field  = "subsystem"
render = "enum"
enum   = { 1 = "native", 2 = "Windows GUI", 3 = "Windows console", 5 = "OS/2 console", 7 = "POSIX console", 9 = "Windows CE GUI", 10 = "EFI application", 11 = "EFI boot service driver", 12 = "EFI runtime driver", 13 = "EFI ROM", 14 = "Xbox", 16 = "Windows boot application" }

[[summary.line]]
label  = "Attributes"
field  = "characteristics"
render = "flags"
flags  = { 1 = "relocations stripped", 2 = "executable", 32 = "large address aware", 512 = "debug stripped", 4096 = "system file", 8192 = "DLL", 16384 = "uniprocessor only" }

[[summary.line]]
label  = "Mitigations"
field  = "dll_characteristics"
render = "flags"
flags  = { 64 = "ASLR", 128 = "force integrity", 256 = "DEP", 512 = "no isolation", 1024 = "no SEH", 2048 = "no bind", 4096 = "AppContainer", 16384 = "control flow guard", 32768 = "terminal server aware" }

[[summary.line]]
label  = "Sections"
field  = "number_of_sections"

[[summary.line]]
label  = "Entry point"
field  = "address_of_entry_point"
render = "hex"

[[summary.line]]
label  = "Image base"
field  = "image_base"
render = "hex"

[[summary.line]]
label  = "Image size"
field  = "size_of_image"
render = "size"

[[summary.line]]
label  = "Built"
field  = "time_date_stamp"
render = "time"
