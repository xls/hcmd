# level is the ASCII digit 1 to 9, the block size in hundreds of kilobytes.
# block_magic is the compressed-block marker 31 41 59 26 53 59, the digits
# of pi.

name   = "bzip2"
endian = "big"
magic  = { offset = 0, bytes = "425A68" }

[[field]]
name   = "signature"
type   = "char"
size   = 3
offset = 0

[[field]]
name   = "level"
type   = "char"
size   = 1
offset = 3

[[field]]
name   = "block_magic"
type   = "bytes"
size   = 6
offset = 4

[summary]
title = "bzip2 archive"

[[summary.line]]
label  = "Block size"
field  = "level"
render = "text"
unit   = "hundred KB"
