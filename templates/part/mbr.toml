label  = "Partition 1"
field  = "p1_type"
render = "enum"
enum   = { 0 = "empty", 1 = "FAT12", 4 = "FAT16 under 32 MB", 5 = "extended", 6 = "FAT16", 7 = "NTFS or exFAT", 11 = "FAT32 CHS", 12 = "FAT32 LBA", 14 = "FAT16 LBA", 15 = "extended LBA", 130 = "Linux swap", 131 = "Linux", 133 = "Linux extended", 142 = "Linux LVM", 165 = "FreeBSD", 168 = "macOS", 169 = "NetBSD", 175 = "HFS+", 191 = "Solaris", 238 = "GPT protective", 239 = "EFI system", 253 = "Linux RAID" }

